plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.company.kioskscan'
    compileSdk 34

    defaultConfig {
        applicationId "com.company.kioskscan"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/kiosk-release.jks")
            storePassword "kiosk12345"
            keyAlias "kioskscan"
            keyPassword "kiosk12345"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            // ใช้ keystore เดียวกับ release เพื่อให้ signature เหมือนกันทุก build
            // -> adb install -r อัปเดตทับได้เสมอ ไม่เจอ INSTALL_FAILED_UPDATE_INCOMPATIBLE อีก
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
